name: Publish isolated design previews without rebuilding game
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Reuse the published formal game against committed checksums. No rebuild.
      # Pages artifacts are short-lived; HTTPS restoration keeps this preview
      # publisher independent of expired artifacts and rejects changed game files.
      - name: Preserve published game and add isolated design directory
        run: |
          mkdir site
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil, urllib.request
          root = Path('site')
          manifest = json.loads(Path('.github/pages-game-manifest.json').read_text())
          assert manifest['index_sha256'] == '0920f6a5bb0be088debf4e6f6894fd33dc3a59c1f91e33d037f3abd21b02e58a'
          for name, checksum in manifest['files'].items():
              relative = Path(name)
              assert not relative.is_absolute() and '..' not in relative.parts, 'Unsafe game manifest path'
              request = urllib.request.Request(manifest['base_url'] + name, headers={'Accept-Encoding': 'identity'})
              data = urllib.request.urlopen(request, timeout=60).read()
              assert hashlib.sha256(data).hexdigest() == checksum, 'Live game changed: refusing stale publication: ' + name
              target = root / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          expected_index = '0920f6a5bb0be088debf4e6f6894fd33dc3a59c1f91e33d037f3abd21b02e58a'
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest(root / 'index.html') == expected_index, 'Unexpected preserved game index'
          live = urllib.request.urlopen('https://hd022311.github.io/family-wealth-empire/', timeout=30).read()
          assert hashlib.sha256(live).hexdigest() == expected_index, 'Live game changed: refusing stale publication'
          before = {str(p.relative_to(root)): digest(p) for p in root.rglob('*') if p.is_file()}
          assert not (root / 'ui-preview').exists(), 'Unexpected existing design directory'
          shutil.copytree('ui-preview', root / 'ui-preview')
          assert not (root / 'theatre-preview').exists(), 'Unexpected existing theatre directory'
          shutil.copytree('theatre-preview', root / 'theatre-preview')
          assert not (root / 'theatre-ui-lab').exists(), 'Unexpected existing UI lab'
          shutil.copytree('theatre-ui-lab', root / 'theatre-ui-lab')
          protected = json.loads(Path('theatre-preview/reports/cinematic-runtime.json').read_text())
          for item in protected['files']:
              assert digest(root / item['path']) == item['sha256'], 'Original volume changed' 
          rehearsal = json.loads(Path('theatre-preview/performance/reports/protected.json').read_text())
          for item in rehearsal['files']:
              assert digest(root / item['path']) == item['sha256'], 'First-volume runtime changed during rehearsal publication'
          pilot = json.loads(Path('theatre-preview/performance/art-samples/male-pilot/reports/preserved.json').read_text())
          for item in pilot['files']:
              assert digest(root / item['path']) == item['sha256'], 'Existing runtime changed during portrait-pilot publication'
          packed = json.loads(Path('theatre-preview/performance/art-samples/male-pilot/reports/packed-layers.json').read_text())
          for item in packed['layers']:
              assert digest(root / ('theatre-preview/performance/art-samples/male-pilot/assets/layers/' + item['id'] + '.png')) == item['sha256'], 'Packed portrait layer changed'
          pilot_assets = json.loads(Path('theatre-preview/performance/art-samples/male-pilot/reports/assets.json').read_text())
          for item in pilot_assets['sources']:
              pilot_root = root / 'theatre-preview/performance/art-samples/male-pilot'
              assert digest(pilot_root / item['source']) == item['source_sha256'], 'Portrait source changed'
              assert digest(pilot_root / item['webp']) == item['webp_sha256'], 'Portrait runtime source changed'
          baseline = json.loads(Path('theatre-preview/performance/before/baseline.json').read_text())
          assert digest(root / 'theatre-preview/performance/before/rehearsal-desktop.mp4') == baseline['original_video_sha256'], 'Before recording changed'
          changed = [name for name, checksum in before.items() if digest(root / name) != checksum]
          assert not changed, f'Published game files changed: {changed}'
          proof = {'source_run_id': 40075521882, 'game_index_sha256': expected_index, 'preserved_game_files': len(before), 'changed_game_files': changed, 'game_files_sha256': before, 'design_directory': '/family-wealth-empire/ui-preview/'}
          proof['game_restore_method'] = 'Published HTTPS files verified against committed checksum manifest; no rebuild'
          proof['preview_directories'] = ['ui-preview/', 'theatre-preview/', 'theatre-ui-lab/']
          (root / 'ui-preview/deployment-proof.json').write_text(json.dumps(proof, indent=2))
          proof['first_volume_runtime'] = protected['files']
          proof['performance_test_protected_runtime'] = rehearsal['files']
          proof['portrait_pilot_protected_runtime'] = pilot['files']
          (root / 'theatre-preview/publication-proof.json').write_text(json.dumps(proof, indent=2))
          (root / 'theatre-ui-lab/publication-proof.json').write_text(json.dumps(proof, indent=2))
          print(f'Preserved {len(before)} original game files; changed game files: 0')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish static design preview alongside identical game
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check public design and unchanged game
        run: |
          python3 - <<'PY'
          import hashlib, time, urllib.request
          base = 'https://hd022311.github.io/family-wealth-empire/'
          for attempt in range(12):
              try:
                  html = urllib.request.urlopen(base + 'ui-preview/', timeout=20).read().decode()
                  assert '三套 UI 設計稿' in html and 'focused.html' in html
                  theatre = urllib.request.urlopen(base + 'theatre-preview/', timeout=20).read().decode()
                  assert '兩間房子的承諾' in theatre
                  for variant in ['a', 'b', 'c']:
                      page = urllib.request.urlopen(base + 'theatre-ui-lab/' + variant + '/', timeout=20).read().decode()
                      assert 'lang="zh-TW"' in page
                  break
              except Exception:
                  if attempt == 11: raise
                  time.sleep(5)
          rehearsal_page = urllib.request.urlopen(base + 'theatre-preview/performance/', timeout=30).read().decode()
          assert 'lang="zh-TW"' in rehearsal_page and 'stage.css' in rehearsal_page
          video = urllib.request.urlopen(base + 'theatre-preview/performance/screenshots/rehearsal-desktop.mp4', timeout=30).read()
          assert b'ftyp' in video[:16], 'Missing actual rehearsal recording'
          for actor in ['male', 'female']:
              art_page = urllib.request.urlopen(base + 'theatre-preview/performance/art-samples/?actor=' + actor, timeout=30).read().decode()
              assert 'lang="zh-TW"' in art_page
              clip = urllib.request.urlopen(base + 'theatre-preview/performance/art-samples/screenshots/' + actor + '-13s.mp4', timeout=30).read()
              assert b'ftyp' in clip[:16], 'Missing character storyboard recording'
          pilot_page = urllib.request.urlopen(base + 'theatre-preview/performance/art-samples/male-pilot/?v=pilot-1', timeout=30).read().decode()
          assert 'lang="zh-TW"' in pilot_page and 'pilot.css' in pilot_page
          pilot_clip = urllib.request.urlopen(base + 'theatre-preview/performance/art-samples/male-pilot/screenshots/male-pilot-14s.mp4', timeout=30).read()
          assert b'ftyp' in pilot_clip[:16], 'Portrait pilot video missing'
          focused = urllib.request.urlopen(base + 'ui-preview/focused.html', timeout=20).read().decode()
          assert '依需展開設計預覽' in focused
          for name in ['a-focus-desktop.png', 'b-focus-desktop.png', 'c-focus-desktop.png', 'a-focus-mobile.png', 'b-focus-mobile.png', 'c-focus-mobile.png']:
              data = urllib.request.urlopen(base + 'ui-preview/mockups/' + name, timeout=30).read()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', name
              print(name, len(data), 'bytes')
          for name in ['desktop-dialogue.png', 'mobile-dialogue.png']:
              data = urllib.request.urlopen(base + 'theatre-preview/screenshots/' + name, timeout=30).read()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', name
              print('Theatre screenshot verified:', name)
          for variant in ['a', 'b', 'c']:
              for device in ['desktop', 'mobile']:
                  data = urllib.request.urlopen(base + 'theatre-ui-lab/screenshots/' + variant + '-' + device + '-normal.png', timeout=30).read()
                  assert data[:8] == b'\x89PNG\r\n\x1a\n'
              print('UI lab verified:', variant)
          game = urllib.request.urlopen(base, timeout=30).read()
          assert hashlib.sha256(game).hexdigest() == '0920f6a5bb0be088debf4e6f6894fd33dc3a59c1f91e33d037f3abd21b02e58a'
          print('Public preview images verified; original game index unchanged.')
          PY
