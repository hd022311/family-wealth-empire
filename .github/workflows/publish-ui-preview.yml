name: Publish independent UI preview without rebuilding game
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # One-time design review: reuse the already deployed game artifact verbatim.
      # Abort if the live game changes; do not rebuild or roll back a newer game.
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 40075521882
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original-artifact
      - name: Preserve published game and add isolated design directory
        run: |
          mkdir site
          tar -xf original-artifact/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil, urllib.request
          root = Path('site')
          expected_index = '0920f6a5bb0be088debf4e6f6894fd33dc3a59c1f91e33d037f3abd21b02e58a'
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest(root / 'index.html') == expected_index, 'Wrong original game artifact'
          live = urllib.request.urlopen('https://hd022311.github.io/family-wealth-empire/', timeout=30).read()
          assert hashlib.sha256(live).hexdigest() == expected_index, 'Live game changed: refusing stale publication'
          before = {str(p.relative_to(root)): digest(p) for p in root.rglob('*') if p.is_file()}
          assert not (root / 'ui-preview').exists(), 'Unexpected existing design directory'
          shutil.copytree('ui-preview', root / 'ui-preview')
          changed = [name for name, checksum in before.items() if digest(root / name) != checksum]
          assert not changed, f'Published game files changed: {changed}'
          proof = {'source_run_id': 40075521882, 'game_index_sha256': expected_index, 'preserved_game_files': len(before), 'changed_game_files': changed, 'game_files_sha256': before, 'design_directory': '/family-wealth-empire/ui-preview/'}
          (root / 'ui-preview/deployment-proof.json').write_text(json.dumps(proof, indent=2))
          print(f'Preserved {len(before)} original game files; changed game files: 0')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish static design preview alongside identical game
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check public design and unchanged game
        run: |
          python3 - <<'PY'
          import hashlib, time, urllib.request
          base = 'https://hd022311.github.io/family-wealth-empire/'
          for attempt in range(12):
              try:
                  html = urllib.request.urlopen(base + 'ui-preview/', timeout=20).read().decode()
                  assert '三套 UI 設計稿' in html and 'focused.html' in html
                  break
              except Exception:
                  if attempt == 11: raise
                  time.sleep(5)
          focused = urllib.request.urlopen(base + 'ui-preview/focused.html', timeout=20).read().decode()
          assert '依需展開設計預覽' in focused
          for name in ['a-focus-desktop.png', 'b-focus-desktop.png', 'c-focus-desktop.png', 'a-focus-mobile.png', 'b-focus-mobile.png', 'c-focus-mobile.png']:
              data = urllib.request.urlopen(base + 'ui-preview/mockups/' + name, timeout=30).read()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', name
              print(name, len(data), 'bytes')
          game = urllib.request.urlopen(base, timeout=30).read()
          assert hashlib.sha256(game).hexdigest() == '0920f6a5bb0be088debf4e6f6894fd33dc3a59c1f91e33d037f3abd21b02e58a'
          print('Public preview images verified; original game index unchanged.')
          PY
