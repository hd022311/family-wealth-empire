name: Review official legal source changes
on:
  schedule:
    - cron: '20 1 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run legal:check
      - run: npm run legal:updates
      - name: Maintainer review summary
        run: |
          echo '## Official source review' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download legal-update-report. Changed pages may be layout changes; review source text and dates before importing drafts. No production rules were changed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: legal-update-report
          path: artifacts/legal-update-report.json
