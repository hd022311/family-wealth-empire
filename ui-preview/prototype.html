<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家族財富帝國・三案視覺評審</title><link rel="stylesheet" href="review.css"></head><body><header class="review-toolbar"><div><b>家族財富帝國｜視覺方向評審</b><small>獨立概念原型・不連接遊戲、不讀寫存檔、不執行財務計算</small></div><label>方案<select id="scheme"><option value="a">A・港都日常（建議）</option><option value="b">B・人生劇場</option><option value="c">C・街坊手帳</option></select></label><label>畫面<select id="screen"><option value="city">城市主畫面</option><option value="building">建築互動</option><option value="family">家庭事件與對話</option><option value="work">工作與時間</option><option value="finance">財務帳本</option><option value="property">房產操作</option></select></label><label>裝置<select id="device"><option value="desktop">桌面</option><option value="mobile">手機</option></select></label><label>字級<select id="scale"><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option></select></label><label class="art-switch"><input id="existing" type="checkbox">現有城市素材對照</label></header><main class="workbench"><div id="game" class="mockgame" aria-label="視覺設計原型"></div></main><script src="review.js"></script></body></html>
