<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1940" role="img" aria-labelledby="title desc"><title id="title">兩間房子的承諾・六次選擇與八種敘事結局</title><desc id="desc">每次選擇三個方向，保留現金、人物記憶與文件狀態後合流。父親與母親各有獨立遺產事件；最後由六次選擇組合判斷結局，法律結果全部待核實。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="#476a54"/></marker></defs><rect width="1360" height="1940" fill="#f5f0e4"/><g font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" fill="#183d37"><text x="48" y="58" font-size="32" font-weight="700">《兩間房子的承諾》劇情分支圖</text><text x="48" y="98" font-size="20">六次選擇共同留下後果；可合流，不重置記憶。法律計算與敘事路由分離。</text><rect x="40" y="140" width="1280" height="174" rx="16" fill="#fffaf0" stroke="#aaba9f"/><text x="64" y="176" font-size="25" font-weight="700">D1・照顧，先從哪裡開始？</text><rect x="64" y="196" width="392" height="54" rx="10" fill="#e3eadb"/><text x="78" y="230" font-size="21">我先親自陪伴</text><rect x="486" y="196" width="392" height="54" rx="10" fill="#e3eadb"/><text x="500" y="230" font-size="21">先和手足排出分工</text><rect x="908" y="196" width="392" height="54" rx="10" fill="#e3eadb"/><text x="922" y="230" font-size="21">詢問專業照顧安排</text><text x="64" y="286" font-size="20">保留後果：時間安排／虛構支出／父母與配偶的感受</text><path d="M680 314v26" stroke="#476a54" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="345" width="1280" height="174" rx="16" fill="#fffaf0" stroke="#aaba9f"/><text x="64" y="381" font-size="25" font-weight="700">D2・哥哥說，他這個月真的拿不出來。</text><rect x="64" y="401" width="392" height="54" rx="10" fill="#e3eadb"/><text x="78" y="435" font-size="21">這次我先墊，寫清楚範圍</text><rect x="486" y="401" width="392" height="54" rx="10" fill="#e3eadb"/><text x="500" y="435" font-size="21">把各家的預算攤開談</text><rect x="908" y="401" width="392" height="54" rx="10" fill="#e3eadb"/><text x="922" y="435" font-size="21">先答應全部，別讓爸媽擔心</text><text x="64" y="491" font-size="20">保留後果：費用紀錄／負擔是否說清／之後手足的回應</text><path d="M680 519v26" stroke="#476a54" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="550" width="1280" height="174" rx="16" fill="#fffaf0" stroke="#aaba9f"/><text x="64" y="586" font-size="25" font-weight="700">D3・「兩間房，最後都留給你，好不好？」</text><rect x="64" y="606" width="392" height="54" rx="10" fill="#e3eadb"/><text x="78" y="640" font-size="21">請爸媽各自尋求專業協助</text><rect x="486" y="606" width="392" height="54" rx="10" fill="#e3eadb"/><text x="500" y="640" font-size="21">先一起談晚年與居住需求</text><rect x="908" y="606" width="392" height="54" rx="10" fill="#e3eadb"/><text x="922" y="640" font-size="21">把爸爸的話先記下來</text><text x="64" y="696" font-size="20">保留後果：各自意願／文件或口頭記憶／效力仍待審核</text><path d="M680 724v26" stroke="#476a54" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="755" width="1280" height="174" rx="16" fill="#fffaf0" stroke="#aaba9f"/><text x="64" y="791" font-size="25" font-weight="700">D4・如果需要現金，要怎麼準備？</text><rect x="64" y="811" width="392" height="54" rx="10" fill="#e3eadb"/><text x="78" y="845" font-size="21">請父親評估壽險安排</text><rect x="486" y="811" width="392" height="54" rx="10" fill="#e3eadb"/><text x="500" y="845" font-size="21">先保留生活預備金</text><rect x="908" y="811" width="392" height="54" rx="10" fill="#e3eadb"/><text x="922" y="845" font-size="21">先核對現有保單影本</text><text x="64" y="901" font-size="20">保留後果：詢問／保留現金／保單資料；無保證承保或理賠</text><path d="M680 929v26" stroke="#476a54" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="960" width="1280" height="174" rx="16" fill="#fffaf0" stroke="#aaba9f"/><text x="64" y="996" font-size="25" font-weight="700">D5・先談爸爸留下什麼，還是先談房子歸誰？</text><rect x="64" y="1016" width="392" height="54" rx="10" fill="#e3eadb"/><text x="78" y="1050" font-size="21">先分開盤點兩位屋主的權利</text><rect x="486" y="1016" width="392" height="54" rx="10" fill="#e3eadb"/><text x="500" y="1050" font-size="21">先談兩間房最後給誰</text><rect x="908" y="1016" width="392" height="54" rx="10" fill="#e3eadb"/><text x="922" y="1050" font-size="21">先付眼前費用，再請專業盤點</text><text x="64" y="1106" font-size="20">保留後果：父親獨立遺產事件；母親原有財產不混入</text><path d="M680 1134v26" stroke="#476a54" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="1165" width="1280" height="174" rx="16" fill="#fffaf0" stroke="#aaba9f"/><text x="64" y="1201" font-size="25" font-weight="700">D6・媽媽也離開了。這次，你想怎麼開始？</text><rect x="64" y="1221" width="392" height="54" rx="10" fill="#e3eadb"/><text x="78" y="1255" font-size="21">先談大家承擔得起的協商方案</text><rect x="486" y="1221" width="392" height="54" rx="10" fill="#e3eadb"/><text x="500" y="1255" font-size="21">先請專業釐清主張，再談</text><rect x="908" y="1221" width="392" height="54" rx="10" fill="#e3eadb"/><text x="922" y="1255" font-size="21">暫不協商，各自尋求法律途徑</text><text x="64" y="1311" font-size="20">保留後果：母親另建事件；協商意願不是分割或裁判</text><path d="M680 1339v36" stroke="#476a54" stroke-width="3" marker-end="url(#arrow)"/><text x="48" y="1410" font-size="24" font-weight="700">依條件優先序判斷八種敘事方向（不是只看最後一題）</text><rect x="40" y="1440" width="312" height="142" rx="12" fill="#fffaf0" stroke="#aaba9f"/><text x="56" y="1475" font-size="21" font-weight="700">E1・留下可對話的家</text><text x="56" y="1518" font-size="20">劇情示範，法律未結算</text><text x="56" y="1552" font-size="18">回顧選擇 → 自願看法源 → 重玩</text><rect x="370" y="1440" width="312" height="142" rx="12" fill="#fffaf0" stroke="#aaba9f"/><text x="386" y="1475" font-size="21" font-weight="700">E2・兩間房之外的生活</text><text x="386" y="1518" font-size="20">劇情示範，法律未結算</text><text x="386" y="1552" font-size="18">回顧選擇 → 自願看法源 → 重玩</text><rect x="700" y="1440" width="312" height="142" rx="12" fill="#fffaf0" stroke="#aaba9f"/><text x="716" y="1475" font-size="21" font-weight="700">E3・遲來的一張餐桌</text><text x="716" y="1518" font-size="20">劇情示範，法律未結算</text><text x="716" y="1552" font-size="18">回顧選擇 → 自願看法源 → 重玩</text><rect x="1030" y="1440" width="312" height="142" rx="12" fill="#fffaf0" stroke="#aaba9f"/><text x="1046" y="1475" font-size="21" font-weight="700">E4・照顧者也需要被照顧</text><text x="1046" y="1518" font-size="20">劇情示範，法律未結算</text><text x="1046" y="1552" font-size="18">回顧選擇 → 自願看法源 → 重玩</text><rect x="40" y="1605" width="312" height="142" rx="12" fill="#fffaf0" stroke="#aaba9f"/><text x="56" y="1640" font-size="21" font-weight="700">E5・文件很齊，心事未完</text><text x="56" y="1683" font-size="20">劇情示範，法律未結算</text><text x="56" y="1717" font-size="18">回顧選擇 → 自願看法源 → 重玩</text><rect x="370" y="1605" width="312" height="142" rx="12" fill="#fffaf0" stroke="#aaba9f"/><text x="386" y="1640" font-size="21" font-weight="700">E6・誰也沒有先退讓</text><text x="386" y="1683" font-size="20">劇情示範，法律未結算</text><text x="386" y="1717" font-size="18">回顧選擇 → 自願看法源 → 重玩</text><rect x="700" y="1605" width="312" height="142" rx="12" fill="#fffaf0" stroke="#aaba9f"/><text x="716" y="1640" font-size="21" font-weight="700">E7・走到談判桌之前</text><text x="716" y="1683" font-size="20">劇情示範，法律未結算</text><text x="716" y="1717" font-size="18">回顧選擇 → 自願看法源 → 重玩</text><rect x="1030" y="1605" width="312" height="142" rx="12" fill="#fffaf0" stroke="#aaba9f"/><text x="1046" y="1640" font-size="21" font-weight="700">E8・把答案留給下一頁</text><text x="1046" y="1683" font-size="20">劇情示範，法律未結算</text><text x="1046" y="1717" font-size="18">回顧選擇 → 自願看法源 → 重玩</text><rect x="40" y="1790" width="1280" height="110" rx="12" fill="#efe2cd" stroke="#ac673d" stroke-dasharray="7 5"/><text x="62" y="1828" font-size="23" font-weight="700">法律閘門：全部 pending_verification</text><text x="62" y="1867" font-size="20">無應繼分／特留分比例、無稅額、無保險給付、無法院勝敗。</text><text x="62" y="1893" font-size="20">官方規則須依事件日期人工審核；父母各次遺產分別處理。</text></g></svg>