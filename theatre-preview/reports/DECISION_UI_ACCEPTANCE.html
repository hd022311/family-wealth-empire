<!doctype html><html lang="zh-TW"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>對話與重要抉擇・前後對照</title><style>body{margin:24px auto;padding:16px;max-width:1200px;font:20px/1.9 system-ui,"Microsoft JhengHei",sans-serif;background:#102a24;color:#fff5e3}a{color:#ead1a7}img{max-width:100%;height:auto}figure{margin:0;min-width:0}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin:24px 0}h2{margin-top:40px}figcaption{padding:8px 0}@media(max-width:700px){.pair{grid-template-columns:1fr}}</style><h1>閱讀，或作出選擇：一眼分清楚</h1><p><a href="../?v=decision-1">公開試玩</a>　<a href="DECISION_UI_ACCEPTANCE.md">完整驗收紀錄</a></p><p>對話只有字幕與點擊繼續；重要抉擇使用獨立構圖及A／B／C。先反白選取，再明確確認，不會因點背景或連點而送出。</p><h2>桌面・一般對話</h2><div class="pair"><figure><figcaption>改版前</figcaption><img loading="lazy" src="decision-ui/before-desktop-dialogue.png" alt="桌面舊對話"></figure><figure><figcaption>改版後</figcaption><img loading="lazy" src="decision-ui/after-desktop-dialogue.png" alt="桌面電影式字幕與點擊繼續"></figure></div><h2>桌面・重要抉擇</h2><div class="pair"><figure><figcaption>改版前</figcaption><img loading="lazy" src="decision-ui/before-desktop-choice.png" alt="桌面舊選項"></figure><figure><figcaption>改版後：先選取，尚未送出</figcaption><img loading="lazy" src="decision-ui/after-desktop-choice.png" alt="重要抉擇標題與ABC選項及確認按鈕"></figure></div><h2>手機・對話與抉擇</h2><div class="pair"><figure><figcaption>改版前・對話</figcaption><img loading="lazy" src="decision-ui/before-mobile-dialogue.png" alt="手機舊對話"></figure><figure><figcaption>改版後・對話</figcaption><img loading="lazy" src="decision-ui/after-mobile-dialogue.png" alt="手機新字幕"></figure><figure><figcaption>改版前・選項</figcaption><img loading="lazy" src="decision-ui/before-mobile-choice.png" alt="手機舊選擇"></figure><figure><figcaption>改版後・抉擇</figcaption><img loading="lazy" src="decision-ui/after-mobile-choice.png" alt="手機重要抉擇"></figure></div><h2>大字閱讀</h2><div class="pair"><figure><figcaption>手機150%，內容可上下捲動</figcaption><img loading="lazy" src="decision-ui/after-mobile-choice-150.png" alt="手機放大文字抉擇"></figure><figure><figcaption>平板125%</figcaption><img loading="lazy" src="decision-ui/after-tablet-choice-125.png" alt="平板重要抉擇"></figure></div><p>43項單元／回歸、36組對話與抉擇版面、三條重玩路線及18組收藏驗收。實體裝置仍待人工驗收。</p><p>未確認即刷新會回到原抉擇並要求重選；確認後刷新接續後續台詞，不重複扣除虛構支出。六次選擇、八結局、法律待核實限制、正式經營模式與State v4不變。</p></html>
