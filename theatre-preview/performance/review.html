<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>動態演出・影片與畫面</title><style>*{box-sizing:border-box}body{margin:0;background:#102726;color:#fff5df;font:20px/1.8 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif}main{max-width:1120px;margin:auto;padding:28px 20px}h1{font-size:1.6em;font-weight:500}a{color:#eed3a0;text-underline-offset:5px;display:inline-block;min-height:48px;padding:8px 0}p{max-width:50em}video{width:100%;max-height:75dvh;background:#081b1a;border:0}img{display:block;width:100%;height:auto}details{padding:18px 0;border-top:1px solid #b8b99866}summary{cursor:pointer;min-height:48px}.mobile{max-width:390px;margin:16px auto}small{font-size:18px}.links{display:flex;gap:28px;flex-wrap:wrap}</style></head><body><main><h1>遺囑公布・動態演出測試</h1><p>以下是實際瀏覽器錄製，約43秒、無配音。人物是分層向量佔位稿，並非正式精緻2.5D立繪。</p><div class="links"><a href="./">親自操作演出</a><a href="reports/TECHNICAL.html">技術與素材規格</a><a href="reports/ACCEPTANCE.html">驗收紀錄</a></div><video controls playsinline preload="metadata" poster="screenshots/desktop-calm.png"><source src="screenshots/rehearsal-desktop.mp4" type="video/mp4">你的瀏覽器無法播放影片，請使用下方連結。</video><a href="screenshots/rehearsal-desktop.mp4">直接開啟演出影片</a><p><small>錄影保留真實字幕與選項，沒有加速或套入正式法律效果。預覽可手動閱讀，不限時間。</small></p><details open><summary>桌面：家庭衝突</summary><a href="screenshots/desktop-conflict.png"><img src="screenshots/desktop-conflict.png" alt="哥哥憤怒、主角震驚的桌面實際畫面" loading="lazy"></a></details><details><summary>桌面：主角震驚與重要選擇</summary><img src="screenshots/desktop-surprise.png" alt="主角震驚的特寫" loading="lazy"><img src="screenshots/desktop-choice.png" alt="三個不同回應選項" loading="lazy"></details><details open><summary>手機：家庭衝突</summary><a class="mobile" href="screenshots/mobile-conflict.png"><img src="screenshots/mobile-conflict.png" alt="手機直式哥哥提出反對的實際畫面" loading="lazy"></a></details><details><summary>手機：平靜、震驚與選擇</summary><img class="mobile" src="screenshots/mobile-calm.png" alt="手機家庭平靜討論" loading="lazy"><img class="mobile" src="screenshots/mobile-surprise.png" alt="手機主角震驚特寫" loading="lazy"><img class="mobile" src="screenshots/mobile-choice.png" alt="手機三個決策選項，可捲動" loading="lazy"></details><details><summary>平板：人物與字幕</summary><img src="screenshots/tablet-conflict.png" alt="平板家庭衝突實際畫面" loading="lazy"></details><p>六種表情可從測試場景的「設定 → 六種表情檢視」操作。確認方向後再決定是否整合完整第一卷。</p></main></body></html>
